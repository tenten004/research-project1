seed: 1
data:
  data_dir: data/cv5_all_axial_3class/fold1
  image_size: 224
  mean: 0.5
  std: 0.5
  num_workers: 4
train:
  batch_size: 16
  epochs: 30
  lr: 3.0e-05
  weight_decay: 0.1
  scheduler: cosine
  best_metric: loss
  checkpoint_metrics:
  - loss
  - accuracy
  - f1
  - roc_auc
  optimizer:
    name: adamw
loss:
  name: cross_entropy
  label_smoothing: 0.1
augmentation:
  enabled: true
  rotation: 15
  hflip: 0.5
  vflip: 0.0
  brightness: 0.2
  contrast: 0.2
  gamma_min: 0.8
  gamma_max: 1.2
model:
  vit_name: deit_small_patch16_224
  num_classes: 3
  drop_rate: 0.1
  drop_path_rate: 0.1
output:
  output_dir: outputs/cv5_all_axial_3class/deit_small_224_reg/fold1
cv:
  protocol: frozen_all_axial_patient_cv5_top5
  fold: 1
  n_splits: 5
  split_seed: 1
  split_unit: patient
  primary_checkpoint: loss
  primary_aggregate_level: patient
  primary_pooling: top_k_confidence
  top_k: 5
  base_config: config/config_repro_vit_all_axial_patient_split_3class_deit_small_224_reg.yaml
