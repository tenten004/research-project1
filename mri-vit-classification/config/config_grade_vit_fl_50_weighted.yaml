seed: 42

data:
  data_dir: data/grade_by_modality/FL
  image_size: 224
  mean: 0.5
  std: 0.5
  num_workers: 4

train:
  batch_size: 16
  epochs: 50
  lr: 0.0001
  weight_decay: 0.0001
  best_metric: f1
  save_confusion_matrix: true
  sampler:
    type: weighted
    method: inverse
    power: 1.0
    effective_beta: 0.9999

loss:
  name: cross_entropy
  class_weighting: none
  class_weights: [1.0, 1.0, 3.0, 5.0, 10.0]
  label_smoothing: 0.0

model:
  vit_name: vit_base_patch16_224
  num_classes: 5

output:
  output_dir: outputs/grade_vit_50_weighted/fl
