seed: 1

data:
  # ViT再現実験: FL+T1の全axial範囲を使用
  data_dir: data/repro_fl_t1_all_axial
  image_size: 80
  mean: 0.0
  std: 1.0
  num_workers: 0

train:
  batch_size: 32
  epochs: 200
  lr: 0.0001
  weight_decay: 0.0
  lr_decay: 0.000001
  optimizer:
    name: rmsprop
    momentum: 0.0
    alpha: 0.99
    eps: 1e-8
    centered: false

augmentation:
  enabled: false

model:
  vit_name: vit_base_patch16_224
  num_classes: 5

output:
  output_dir: outputs/repro_vit_all_axial
